<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: #1b1b1f; color: #e8e8ee; font: 12px/1.5 "Segoe UI", sans-serif; }
    #wrap { padding: 12px; }
    h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; letter-spacing: .3px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f06a6a; margin-right: 6px; }
    .dot.on { background: #4fd1a1; }
    #log { margin-top: 10px; padding: 8px; background: #121216; border: 1px solid #2a2a33; border-radius: 8px; height: 300px; overflow: auto; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 11px; color: #b9b9c6; }
    .muted { color: #8a8a99; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1><span id="dot" class="dot"></span>DSH AE Bridge</h1>
    <div class="muted">本地桥：<span id="ep">http://127.0.0.1:8791</span></div>
    <div class="muted">AE <span id="ver">-</span> · <span id="stat">connecting…</span></div>
    <div id="log"></div>
  </div>
  <script>
    var BASE = "http://127.0.0.1:8791";
    var logEl = document.getElementById("log");
    var dotEl = document.getElementById("dot");
    var statEl = document.getElementById("stat");

    function log(msg) {
      var t = new Date().toTimeString().slice(0, 8);
      logEl.textContent += "[" + t + "] " + msg + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setState(on, text) {
      dotEl.className = on ? "dot on" : "dot";
      statEl.textContent = text;
    }

    function evalInAE(script) {
      return new Promise(function (resolve) {
        try {
          window.__adobe_cep__.evalScript(script, function (res) { resolve(String(res)); });
        } catch (e) {
          resolve("EVAL_ERROR: " + e.message);
        }
      });
    }

    async function postResult(id, result, error) {
      try {
        await fetch(BASE + "/result", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id, result: result, error: error || null })
        });
      } catch (e) {
        log("result post failed: " + e.message);
      }
    }

    async function loop() {
      for (;;) {
        try {
          var res = await fetch(BASE + "/next?wait=20", { cache: "no-store" });
          if (res.status === 204) { setState(true, "idle"); continue; }
          var cmd = await res.json();
          setState(true, "executing #" + cmd.id);
          log("exec #" + cmd.id + "  " + cmd.script.slice(0, 90).replace(/\n/g, " "));
          var out = await evalInAE(cmd.script);
          log("done #" + cmd.id + "  " + String(out).slice(0, 200).replace(/\n/g, " "));
          await postResult(cmd.id, out, null);
        } catch (e) {
          setState(false, "bridge offline");
          await new Promise(function (r) { setTimeout(r, 2000); });
        }
      }
    }

    window.addEventListener("load", function () {
      try { log("AE version: " + window.__adobe_cep__.getHostEnvironment().appVersion); } catch (e) {}
      try { document.getElementById("ver").textContent = window.__adobe_cep__.getHostEnvironment().appVersion; } catch (e) {}
      loop();
    });
  </script>
</body>
</html>
